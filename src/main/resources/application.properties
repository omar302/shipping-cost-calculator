spring.application.name=shipping-calculator

# API keys — see docs/specs/api-security.specs.md.
#
# Keyed by the API key itself, so several keys can share a role and one can be
# rotated or revoked without affecting the others. The role must be USER or
# ADMIN; anything else fails at startup rather than at the first request.
#
# No keys are configured here on purpose: real keys are credentials and are
# supplied per environment. Until some are, every endpoint except the
# documentation refuses with 401 — that is the intended default, not a fault.
#
# shipping.api-keys.7f3a91c4=USER
# shipping.api-keys.e91c7a2b=ADMIN
